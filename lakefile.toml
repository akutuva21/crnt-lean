name = "crnt-lean"
defaultTargets = ["CRNT"]
testRunner = "test"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.31.0"

[[lean_lib]]
name = "CRNT"
globs = ["CRNT", "CRNT.+"]

[[lean_lib]]
name = "test"
globs = ["test.+"]

[[lean_exe]]
name = "analyze"
root = "Analyze"
