# GENERATED by scripts/gen_lakefile.py -- do not edit by hand.
# The single source of truth for what is and is not verified is
# scripts/unverified_modules.txt.  Edit that, then regenerate.

name = "crnt-lean"
defaultTargets = ["CRNT"]
testRunner = "test"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.0"

# The verified core: everything under CRNT/ except the ledger.  Globbing by pattern
# (rather than enumerating modules) means a newly added file is in the build by default
# and has to be deliberately excluded, not the other way round.
[[lean_lib]]
name = "CRNT"
globs = ["CRNT", "CRNT.+"]
excludeGlobs = []

# The frontier: the ledger plus everything the frontier target has ever covered
# (scripts/frontier_history.txt).  `CRNTFrontier.lean` is generated from the same set,
# so a module that graduates out of the ledger is elaborated here instead of quietly
# dropping out of the metric.  Historically expected to fail; the count, not the
# colour, is the progress metric.  See CRNTFrontier.lean.
[[lean_lib]]
name = "CRNTFrontier"
globs = [
  "CRNTFrontier",
  "CRNT.Dynamics.GlobalAttractorTheorem",
  "CRNT.Dynamics.HighCodimensionSiphonFace",
  "CRNT.Multistationarity.TrueChemistrySRCriterion",
  "CRNT.Oscillation",
  "CRNT.Oscillation.CompatibilityAdapters",
  "CRNT.Oscillation.DHopfOpenness",
  "CRNT.Oscillation.DiagonalScaling",
  "CRNT.Oscillation.FisherFullerScaling",
  "CRNT.Oscillation.FloquetOrbitalStability",
  "CRNT.Oscillation.FloquetPersistenceGeneral",
  "CRNT.Oscillation.GlobalHopfIndex",
  "CRNT.Oscillation.GlobalHopfIndexTheorem",
  "CRNT.Oscillation.GlobalHopfSpectralCrossing",
  "CRNT.Oscillation.HalfPlanePolynomial",
  "CRNT.Oscillation.HurwitzBordering",
  "CRNT.Oscillation.OscillationKernelBundle",
  "CRNT.Oscillation.ParameterRichGlobalHopf",
  "CRNT.Oscillation.PlanarAdjacentReturnLoop",
  "CRNT.Oscillation.PlanarDivergenceRegularity",
  "CRNT.Oscillation.PlanarEndToEnd",
  "CRNT.Oscillation.PlanarFlowRegularity",
  "CRNT.Oscillation.PlanarGreenGrid",
  "CRNT.Oscillation.PlanarGreenJordanApproximation",
  "CRNT.Oscillation.PlanarGreenRectangle",
  "CRNT.Oscillation.PlanarJordanBoundaryCurrent",
  "CRNT.Oscillation.PlanarJordanCrossingOrder",
  "CRNT.Oscillation.PlanarJordanDyadic",
  "CRNT.Oscillation.PlanarJordanTopology",
  "CRNT.Oscillation.PlanarLocalReturnLoops",
  "CRNT.Oscillation.PlanarLocalReturns",
  "CRNT.Oscillation.PlanarPoincareBendixson",
  "CRNT.Oscillation.PlanarReturnMonotonicity",
  "CRNT.Oscillation.PlanarSectionHitIsolation",
  "CRNT.Oscillation.ReducedKineticContinuation",
  "CRNT.Oscillation.SimpleNegativeSpectrum",
  "CRNT.Oscillation.SmoothGlobalHopf",
  "CRNT.Oscillation.SpectralOpenness",
  "CRNT.Oscillation.StableCodimOneDHopf",
  "CRNT.Oscillation.VassenaPrincipal",
  "CRNT.Theorems.DeficiencyOne.DegreeExistence",
  "CRNT.Theorems.DeficiencyOne.Theorem",
  "CRNT.Theorems.DeficiencyOne.WeaklyReversibleExistence"
]

# The staged expansion: everything under Scaffold/, i.e. the CRNT theory-expansion
# modules that are deliberately kept out of CRNT/ until they are promoted.  They used
# to sit in no lake target at all -- tracked in git but elaborated by nothing, so
# nothing failed when they drifted out of reach of the pinned Mathlib API.  They now
# elaborate, and this target is what keeps that a build result rather than a claim.
[[lean_lib]]
name = "Scaffold"
globs = ["Scaffold.+"]

[[lean_lib]]
name = "test"
globs = [
  "test.AxiomAudit",
  "test.BanajiCraciunAudit",
  "test.FrontierAuditCurrent",
  "test.NonVacuity",
  "test.Oscillation",
  "test.Smoke",
  "test.StochasticBirthDeathCounterexample",
  "test.ToricBarrierAudit"
]

[[lean_exe]]
name = "analyze"
root = "Analyze"
