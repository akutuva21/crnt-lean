# GENERATED by scripts/gen_lakefile.py -- do not edit by hand.
# The single source of truth for what is and is not verified is
# scripts/unverified_modules.txt.  Edit that, then regenerate.

name = "crnt-lean"
defaultTargets = ["CRNT"]
testRunner = "test"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.0"

# The verified core: everything under CRNT/ except the ledger.  Globbing by pattern
# (rather than enumerating modules) means a newly added file is in the build by default
# and has to be deliberately excluded, not the other way round.
[[lean_lib]]
name = "CRNT"
globs = ["CRNT", "CRNT.+"]
excludeGlobs = []

# The frontier: exactly the modules in the ledger.  `CRNTFrontier.lean` imports every module
# the ledger has ever listed, so this target still compiles all of them -- and CI's error
# count still measures them -- even when the ledger itself is empty.  Historically expected
# to fail; the count, not the colour, is the progress metric.  See CRNTFrontier.lean.
[[lean_lib]]
name = "CRNTFrontier"
globs = [
  "CRNTFrontier"
]

[[lean_lib]]
name = "test"
globs = [
  "test.AxiomAudit",
  "test.FrontierAuditCurrent",
  "test.NonVacuity",
  "test.Oscillation",
  "test.Smoke",
  "test.StochasticBirthDeathCounterexample",
  "test.ToricBarrierAudit",
  "test.VacuityAudit"
]

[[lean_exe]]
name = "analyze"
root = "Analyze"
